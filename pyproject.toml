[project]
name = "agentic-pentest"
version = "0.1.0"
description = "Evidence-Guided Agentic Web/API Pentesting Platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Vuong Thanh Dat", email = "dat@example.com" }
]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "networkx>=3.2.0",
    "litellm>=1.82.0",
    "loguru>=0.7.0",
    "typer>=0.12.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0.0",
    "rich>=13.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "respx>=0.21.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "schemathesis>=3.25.0"
]

[project.scripts]
agentic-pentest = "agentic_pentest.presentation.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "litellm",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
