version: '3.8'

# OWASP crAPI (Community Rest API) official evaluation benchmark container setup
# Usage: docker compose -f deployments/docker-compose.crapi.yml up -d

services:
  crapi-web:
    image: crapi/crapi-web:latest
    container_name: crapi-web
    ports:
      - "8888:80"
    environment:
      - LISTEN_PORT=80
    depends_on:
      - user-service
      - vehicle-service
      - workshop-service
      - community-service

  user-service:
    image: crapi/crapi-identity:latest
    container_name: crapi-identity
    environment:
      - JWT_SECRET=SecretKeyForcrAPIBenchmarkEvaluationToken2026!
      - DB_HOST=crapi-postgres
      - DB_USER=crapi
      - DB_PASSWORD=crapi
      - DB_NAME=crapi
    depends_on:
      - crapi-postgres

  vehicle-service:
    image: crapi/crapi-identity:latest
    container_name: crapi-vehicle
    environment:
      - JWT_SECRET=SecretKeyForcrAPIBenchmarkEvaluationToken2026!
      - DB_HOST=crapi-postgres
    depends_on:
      - crapi-postgres

  workshop-service:
    image: crapi/crapi-workshop:latest
    container_name: crapi-workshop
    environment:
      - DB_HOST=crapi-postgres
      - DB_USER=crapi
      - DB_PASSWORD=crapi
      - DB_NAME=crapi
    depends_on:
      - crapi-postgres

  community-service:
    image: crapi/crapi-community:latest
    container_name: crapi-community
    environment:
      - DB_HOST=crapi-postgres
      - DB_USER=crapi
      - DB_PASSWORD=crapi
      - DB_NAME=crapi
    depends_on:
      - crapi-postgres

  crapi-postgres:
    image: postgres:14-alpine
    container_name: crapi-postgres
    environment:
      - POSTGRES_USER=crapi
      - POSTGRES_PASSWORD=crapi
      - POSTGRES_DB=crapi
    ports:
      - "5432:5432"
